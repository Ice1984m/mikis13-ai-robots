name: Build APK
on: [workflow_dispatch, push]
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: {distribution: temurin, java-version: '17'}
   - run: wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip && unzip -q gradle-8.11.1-bin.zip
   - run: ../gradle-8.11.1/bin/gradle assembleDebug
     working-directory: android
   - uses: actions/upload-artifact@v4
     with: {name: Mikis13-AI-Robots-APK, path: android/app/build/outputs/apk/debug/app-debug.apk}
