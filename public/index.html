<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mikis13 AI Robots</title><style>body{margin:0;background:radial-gradient(circle at top,#19366c,#050914 55%);color:#eef6ff;font-family:system-ui}header,main{max-width:1100px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card,.panel{background:#0b1729dd;border:1px solid #31537d;border-radius:20px;padding:18px;box-shadow:0 18px 50px #0008}.on{color:#55f49a}.off{color:#ff788d}select,textarea,button{width:100%;box-sizing:border-box;margin:7px 0;padding:12px;border-radius:12px;border:1px solid #345578;background:#07101e;color:white}textarea{min-height:130px}button{background:linear-gradient(90deg,#1678ff,#8b4dff);font-weight:800;border:0}.apk-btn{display:inline-block;background:linear-gradient(90deg,#16a34a,#22c55e);color:#fff;font-weight:800;padding:14px 28px;border-radius:14px;text-decoration:none;font-size:1.1rem;box-shadow:0 4px 20px #16a34a66;margin:14px 0}pre{white-space:pre-wrap;background:#030710;padding:14px;border-radius:12px}</style><header><h1>🤖 MIKIS13 AI ROBOTS</h1><p>5 lokale GitHub-werkbots • kosten lokaal: € 0,00</p><a class="apk-btn" href="https://github.com/Ice1984m/mikis13-ai-robots/actions/workflows/build-apk.yml" target="_blank">📲 Download APK</a></header><main><section id="bots" class="grid"></section><section class="panel"><select id="bot"></select><textarea id="task" placeholder="Taak voor een eigen of toegestane repository"></textarea><button id="run">Uitvoeren</button><pre id="out">Gereed.</pre></section></main><script>const names=['Issue Scout','Bug Solver','Test Engineer','PR Reviewer','Release Robot'];names.forEach((n,i)=>bot.add(new Option(n,i+1)));async function s(){const j=await(await fetch('/api/status')).json();bots.innerHTML=j.bots.map(b=>`<article class=card><h3>${b.name}</h3><b class=${b.status==='online'?'on':'off'}>● ${b.status}</b><p>${b.role||b.error||''}</p></article>`).join('')}run.onclick=async()=>{out.textContent='Bot werkt…';const r=await fetch('/api/task/'+bot.value,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:task.value})});out.textContent=JSON.stringify(await r.json(),null,2)};s();setInterval(s,10000)</script></html>
